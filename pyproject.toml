[project]
name = "tcc-gnn"
version = "0.0.1"
description = "TCC — Sumarização de vídeo com GNN sobre grafo time-aware (HieTaSumm + SLC-HELM)"
authors = [{ name = "Caio Notini" }]
requires-python = ">=3.10"

dependencies = [
    # Grafo e hierarquia (mesma stack usada por HieTaSumm-lib e mHELMNet)
    "networkx>=3.0",
    "higra>=0.6",

    # Extração de features (torchvision no lugar do TF/Keras do HieTaSumm-lib original —
    # ver seção "Stack e Configuração Inicial" no doc de escopo)
    "torch>=2.2",
    "torchvision>=0.17",

    # GNN
    # torch-scatter NÃO entra aqui de propósito: exige compilar contra o build exato do
    # torch instalado (via wheel do data.pyg.org) e não tem wheel pronta pra versões muito
    # recentes do torch. PyG >=2.3 já tem fallback nativo em PyTorch puro pras operações de
    # scatter, então não é bloqueante — só reconsiderar se algum gargalo de performance real
    # aparecer mais pra frente (aí instala à parte, com -f https://data.pyg.org/whl/torch-<versão>+cpu.html).
    "torch-geometric>=2.5",

    # Processamento de vídeo / imagem
    "opencv-python>=4.9",
    "pillow>=10.0",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "scipy>=1.12",

    # Avaliação (F-score, Kendall's tau, Spearman's rho vêm do scipy/scikit-learn acima)
    "numpy>=1.26",

    # Leitura de datasets pré-extraídos em .h5 (SumMe/TVSum no formato eccv16_dataset)
    "h5py>=3.10",

    # Tracking de experimentos (mesmo usado no mHELMNet do lab)
    "mlflow>=2.10",

    # Config
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

# Dependência TEMPORÁRIA, só pra fase de validação.
tf-validation = [
    "tensorflow>=2.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]