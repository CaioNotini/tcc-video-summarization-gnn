# Config de experimento — equivalente ao options.json do HieTaSumm-lib (Leonardo),
# em YAML para ficar consistente com o resto do repo. Lido por src/tcc_gnn/config.py.

graph:
  # janela temporal (em nº de frames) usada por Frame.py no HieTaSumm-lib;
  # 32 = rate * time do options.json (8 s a 4 fps), D-24
  delta_t: 32
  rate: 4 # frames amostrados por segundo, um a cada 0,25 s (D-25)

hierarchy:
  # baseline de comparação (watershed_hierarchy_by_area binarizada, fixa no código portado)
  alpha: 75 # options.json: cutNumber = int(bestCutNumber * alpha/100) (D-20)
  percent: 15 # options.json: orçamento de keyshots em % dos frames amostrados (D-21)

  # método principal (novo, sem código de referência disponível — SLC-HELM não foi compartilhado)
  slc:
    enabled: true
    distance_threshold: null # a definir empiricamente

model:
  embedding_size: 64
  gat_heads: 4

training:
  unsupervised_objective: null # graph_reconstruction | D17 definir ainda
  epochs: 100
  lr: 0.001
  batch_size: 1 # um vídeo = um grafo

experiment_tracking:
  # mlflow 3.18 recusa o backend de arquivo; banco SQLite e artefatos ficam em ./mlruns/
  tracking_uri: "sqlite:///mlruns/mlflow.db"
  artifact_root: "./mlruns"
